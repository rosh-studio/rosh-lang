[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rosh"
version = "0.0.9"
description = "A spoken-language-first, stack-based, AI-native programming language"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Rosh Project"}
]
urls = {Homepage = "https://github.com/rdubar/rosh", Repository = "https://github.com/rdubar/rosh"}
dependencies = [
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0"
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.scripts]
rosh = "rosh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
