[project]
name = "rosh-lang"
version = "0.4.0"
description = "Rosh language — parser, runtime, and composition engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rosh = "rosh_lang.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
