[project]
name = "rosh-lang"
version = "0.5.0"
description = "Rosh language — parser, runtime, and composition engine"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rosh = "rosh_lang.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosh_lang"]

[tool.hatch.build.targets.wheel.force-include]
"src/rosh_lang/library" = "rosh_lang/library"

[tool.pytest.ini_options]
testpaths = ["tests"]
