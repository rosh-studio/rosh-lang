<!DOCTYPE html>
<html>
<head>
    <title>Rosh Phaser Adapter Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="info">
        Press <kbd>`</kbd> or <button onclick="RoshRuntime.toggleConsole()">Click Here</button> to open Rosh Console<br>
        Try: <code>create ball</code>, <code>create banana</code>, <code>list</code>, <code>set ball color to red</code>
    </div>
    <div id="game-container"></div>

    <!-- Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- Rosh Runtime -->
    <script src="rosh-runtime.js"></script>
    <script src="rosh-adapter-phaser.js"></script>

    <!-- Known objects (inline for test) -->
    <script>
        // Subset of known_objects.toml for testing
        // Using shapes that look reasonable as 2D representations
        const KNOWN_OBJECTS = {
            banana: {
                description: "A bright yellow banana, slightly curved",
                "2d": { color: "yellow", shape: "ellipse", width: 0.4, height: 1.2 }
            },
            apple: {
                description: "A shiny red apple",
                "2d": { color: "red", shape: "circle" }
            },
            tree: {
                description: "A tall green tree",
                "2d": { color: "green", shape: "triangle", width: 1.0, height: 2.0 }
            },
            coin: {
                description: "A shiny gold coin",
                "2d": { color: "gold", shape: "circle", scale: 0.5 }
            },
            player: {
                description: "The player character",
                "2d": { color: "blue", shape: "rectangle", width: 0.6, height: 1.5 }
            },
            enemy: {
                description: "A hostile enemy",
                "2d": { color: "red", shape: "rectangle", width: 0.6, height: 1.3 }
            },
            orc: {
                description: "A fierce green orc warrior",
                "2d": { color: "green", shape: "rectangle", width: 0.8, height: 1.6 }
            },
            ball: {
                description: "A red ball",
                "2d": { color: "red", shape: "circle" }
            }
        };
    </script>

    <script>
        // =================================================================
        // Phaser Game Setup
        // =================================================================
        class MainScene extends Phaser.Scene {
            constructor() {
                super({ key: 'MainScene' });
            }

            preload() {
                // Create simple colored textures for testing
                this.createColorTexture('ground', 0x333333, 800, 100);
            }

            createColorTexture(key, color, width, height) {
                const graphics = this.make.graphics({ add: false });
                graphics.fillStyle(color);
                graphics.fillRect(0, 0, width, height);
                graphics.generateTexture(key, width, height);
                graphics.destroy();
            }

            create() {
                // Background
                this.cameras.main.setBackgroundColor('#1a1a2e');

                // Ground
                const ground = this.add.image(400, 550, 'ground');
                ground.name = '_ground';

                // Grid lines for reference
                const graphics = this.add.graphics();
                graphics.lineStyle(1, 0x444444, 0.5);
                for (let x = 0; x <= 800; x += 50) {
                    graphics.moveTo(x, 0);
                    graphics.lineTo(x, 600);
                }
                for (let y = 0; y <= 600; y += 50) {
                    graphics.moveTo(0, y);
                    graphics.lineTo(800, y);
                }
                graphics.strokePath();

                // Create some initial objects
                this.createInitialObjects();

                // Initialize Rosh Runtime
                this.initRosh();
            }

            createInitialObjects() {
                // Red box
                const redBox = this.add.rectangle(200, 300, 50, 50, 0xff0000);
                redBox.name = 'redbox';
                redBox.setData('_type', 'rectangle');
                redBox.setData('_color', 'red');
                redBox.setData('_roshId', 'redbox');

                // Green box
                const greenBox = this.add.rectangle(400, 300, 50, 50, 0x00ff00);
                greenBox.name = 'greenbox';
                greenBox.setData('_type', 'rectangle');
                greenBox.setData('_color', 'green');
                greenBox.setData('_roshId', 'greenbox');

                // Blue box
                const blueBox = this.add.rectangle(600, 300, 50, 50, 0x0000ff);
                blueBox.name = 'bluebox';
                blueBox.setData('_type', 'rectangle');
                blueBox.setData('_color', 'blue');
                blueBox.setData('_roshId', 'bluebox');

                // Store references for adapter registration
                this.initialObjects = [redBox, greenBox, blueBox];
            }

            initRosh() {
                console.log('initRosh called');

                // Create Phaser adapter with known objects
                const adapter = createPhaserAdapter(this, {
                    knownObjects: KNOWN_OBJECTS,
                    assetPath: 'assets/'
                });
                console.log('Adapter created:', adapter);

                // Register initial objects
                for (const obj of this.initialObjects) {
                    adapter.registerObject(obj.name, obj);
                }
                console.log('Objects registered');

                // Initialize Rosh runtime
                console.log('RoshRuntime:', typeof RoshRuntime);
                RoshRuntime.init(adapter);
                console.log('RoshRuntime.init() called');

                // Make available globally for debugging
                window.adapter = adapter;
                window.scene = this;

                console.log('Rosh Phaser Test loaded. Press ` to open console.');
            }

            update(time, delta) {
                // Animation loop - adapter.update() would go here if needed
            }
        }

        // Phaser game config
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            scene: MainScene,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            input: {
                keyboard: {
                    capture: []  // Don't capture any keys globally - let them pass through
                }
            }
        };

        // Create game
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
