<!DOCTYPE html>
<html>
<head>
    <title>Rosh Three.js Adapter Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        Press <kbd>`</kbd> or <button onclick="RoshRuntime.toggleConsole()">Click Here</button> to open Rosh Console<br>
        Try: <code>create ball</code>, <code>create banana</code>, <code>list</code>, <code>set ball color to red</code>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Rosh Runtime -->
    <script src="rosh-runtime.js"></script>
    <script src="rosh-adapter-threejs.js"></script>

    <!-- Known objects (inline for test - same as Phaser test) -->
    <script>
        // Subset of known_objects.toml for testing
        const KNOWN_OBJECTS = {
            banana: {
                description: "A bright yellow banana, slightly curved",
                "3d": { shape: "cylinder", color: 0xffe135, scaleX: 0.3, scaleY: 1.2, scaleZ: 0.3 }
            },
            apple: {
                description: "A shiny red apple",
                "3d": { shape: "sphere", color: 0xff0000 }
            },
            tree: {
                description: "A tall green tree",
                "3d": { shape: "cylinder", color: 0x228b22, scaleY: 2.0 }
            },
            coin: {
                description: "A shiny gold coin",
                "3d": { shape: "cylinder", color: 0xffd700, scaleX: 1.0, scaleY: 0.1, scaleZ: 1.0 }
            },
            player: {
                description: "The player character",
                "3d": { shape: "box", color: 0x4169e1, scaleY: 1.8 }
            },
            enemy: {
                description: "A hostile enemy",
                "3d": { shape: "box", color: 0xff4500, scaleY: 1.5 }
            },
            orc: {
                description: "A fierce green orc warrior",
                "3d": { shape: "box", color: 0x228b22, scaleX: 2.5, scaleY: 2.5, scaleZ: 2.5 }
            }
        };
    </script>

    <script>
        // =================================================================
        // Three.js Scene Setup
        // =================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.1, 2000
        );
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambient = new THREE.AmbientLight(0x404040);
        scene.add(ambient);

        const directional = new THREE.DirectionalLight(0xffffff, 1);
        directional.position.set(5, 10, 5);
        scene.add(directional);

        // Ground plane
        const groundGeom = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.name = '_ground';
        scene.add(ground);

        // Grid helper
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x444444);
        scene.add(grid);

        // =================================================================
        // Create some initial objects
        // =================================================================
        const initialObjects = [];

        function createBox(name, x, y, z, color) {
            const geom = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshStandardMaterial({ color });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            mesh.name = name;
            mesh.userData._type = 'box';
            mesh.userData._color = color === 0xff0000 ? 'red' : color === 0x00ff00 ? 'green' : 'blue';
            mesh.userData._roshId = name;
            scene.add(mesh);
            initialObjects.push(mesh);
            return mesh;
        }

        createBox('redbox', -2, 0.5, 0, 0xff0000);
        createBox('greenbox', 0, 0.5, 0, 0x00ff00);
        createBox('bluebox', 2, 0.5, 0, 0x0000ff);

        // =================================================================
        // Initialize Rosh Runtime
        // =================================================================
        const adapter = createThreeJSAdapter(scene, camera, renderer, {
            knownObjects: KNOWN_OBJECTS
        });

        // Register initial objects
        for (const obj of initialObjects) {
            adapter.registerObject(obj.name, obj);
        }

        // Initialize Rosh runtime
        RoshRuntime.init(adapter);

        // Make available globally for debugging
        window.adapter = adapter;
        window.scene = scene;

        console.log('Rosh Three.js Test loaded. Press ` to open console.');

        // =================================================================
        // Animation Loop
        // =================================================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
