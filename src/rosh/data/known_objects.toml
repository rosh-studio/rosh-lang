# Rosh Known Objects Registry
#
# This file defines preset objects that can be created by name in any Rosh program.
# Each emitter interprets these properties for its world type:
#   - text: description used for "look" and text adventures
#   - 2d: color, shape for Phaser/Pygame
#   - 3d: shape, scale for Three.js
#
# Programs can import additional known objects or override these defaults.
# Usage: create banana, clone apple, etc.

# =============================================================================
# FOOD - Fruits, vegetables, consumables
# =============================================================================

[banana]
description = "A bright yellow banana, slightly curved"
category = "food"
[banana.2d]
color = "yellow"
shape = "ellipse"
width = 0.6
height = 1.0
[banana.3d]
shape = "cylinder"
color = 0xffe135
scaleX = 0.3
scaleY = 1.2
scaleZ = 0.3
model = "3d_glb/banana.glb"
credit = "Banana by Batuhan13 (CC BY 4.0)"
credit_url = "https://skfb.ly/6WNQI"

