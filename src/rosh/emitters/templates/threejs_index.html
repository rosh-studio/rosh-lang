<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosh Game - Three.js</title>
    <!-- Inter font (brand font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
        }
        #game-container {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #888;
            font-size: 12px;
            z-index: 100;
        }
        .controls-hint {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: #666;
            font-size: 11px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="info">🤖 Rosh → Three.js (3D)</div>
    <div class="controls-hint">🖱️ Drag to rotate | Scroll to zoom | WASD move | Q/E up/down | ←→ rotate view</div>

    <!--
        Three.js r128 (non-module version)

        Version Decision (2024-12-16):
        - Using r128 for stability and broad browser compatibility
        - Non-module loading avoids ES module issues in Safari/older browsers
        - Newer versions (0.160.x+) require ES modules which had compatibility issues
        - OrbitControls from same version for API compatibility

        Future considerations:
        - Add SRI hashes for security if needed
        - Bundle locally for offline demos if needed
        - Upgrade when ES module support is universal
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Generated game code -->
    <script src="game.js"></script>
</body>
</html>
