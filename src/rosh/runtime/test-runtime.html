<!DOCTYPE html>
<html>
<head>
    <title>Rosh Runtime Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #info {
            position: absolute; top: 10px; left: 10px;
            color: #0f0; font-family: monospace; font-size: 14px;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        Press <kbd>`</kbd> or <button onclick="window.rosh.toggleConsole()">Click Here</button> to open Rosh Console<br>
        Try: <code>create ball</code>, <code>list</code>, <code>set ball-* color to red</code>
    </div>

    <!-- Three.js from CDN (older version with non-module OrbitControls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Rosh Runtime -->
    <script src="rosh-runtime.js"></script>
    <script src="threejs-adapter.js"></script>

    <script>
        // =================================================================
        // Three.js Scene Setup
        // =================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.1, 2000
        );
        camera.position.set(0, 100, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambient = new THREE.AmbientLight(0x404040);
        scene.add(ambient);

        const directional = new THREE.DirectionalLight(0xffffff, 1);
        directional.position.set(100, 200, 100);
        scene.add(directional);

        // Ground plane
        const groundGeom = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.name = '_ground';  // Underscore prefix = hidden from list
        scene.add(ground);

        // Grid helper
        const grid = new THREE.GridHelper(500, 20, 0x444444, 0x444444);
        scene.add(grid);

        // =================================================================
        // Create some initial objects
        // =================================================================
        function createBox(name, x, y, z, color) {
            const geom = new THREE.BoxGeometry(30, 30, 30);
            const mat = new THREE.MeshStandardMaterial({ color });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            mesh.name = name;
            mesh.userData._type = 'box';
            scene.add(mesh);
            return mesh;
        }

        createBox('redbox', -50, 15, 0, 0xff0000);
        createBox('greenbox', 0, 15, 0, 0x00ff00);
        createBox('bluebox', 50, 15, 0, 0x0000ff);

        // =================================================================
        // Initialize Rosh Runtime
        // =================================================================
        const adapter = new ThreeJSAdapter(scene, camera, renderer);
        const rosh = new RoshRuntime(adapter, {
            confirmThreshold: 10,
            bulkLogLimit: 10
        });
        rosh.init();

        // Make available globally for debugging
        window.rosh = rosh;
        window.adapter = adapter;
        window.scene = scene;

        // =================================================================
        // Animation Loop
        // =================================================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Rosh Runtime Test loaded. Press ` to open console.');
    </script>
</body>
</html>
