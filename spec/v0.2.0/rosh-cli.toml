# Rosh CLI/REPL Specification v0.2.0
#
# SINGLE SOURCE OF TRUTH for all REPL commands
# All implementations MUST comply with this spec
#
# Run: rosh audit --spec cli
# Test: pytest tests/spec/test_cli_compliance.py

[meta]
version = "0.2.0"
description = "Rosh CLI/REPL command specification"
status = "draft"
experimental = true
experimental_warning = "EXPERIMENTAL: Rosh v0.2.0 - Language semantics may change."

# =============================================================================
# COMMANDS
# =============================================================================
# Each command defines:
#   canonical  - The correct form stored in history
#   aliases    - Alternative names (all valid)
#   typos      - Common misspellings (corrected with warning)
#   syntax     - Usage pattern
#   arg_style  - How arguments are passed: "array", "single", "joined", "cmd_array", "none"
#   layer      - Which runtime layer: "core", "3d", "2d", "voice"
#   behavior   - Special behaviors and edge cases

# -----------------------------------------------------------------------------
# CORE LAYER - Base REPL infrastructure
# -----------------------------------------------------------------------------

[commands.help]
canonical = "help"
aliases = []
typos = ["hlep", "hepl", "hep"]
syntax = "help [<command>]"
arg_style = "array"
layer = "core"
description = "Show help for commands"

[commands.help.examples]
"help" = { output = "Available commands: create, set, get, ..." }
"help create" = { output = "create [<type>] <name> - Create a new object" }

# -----------------------------------------------------------------------------

[commands.version]
canonical = "version"
aliases = ["ver", "v"]
typos = ["verison", "verson"]
syntax = "version"
arg_style = "none"
layer = "core"
description = "Show Rosh version"

[commands.version.examples]
"version" = { output = "Rosh v0.2.0 (IR 0.2.0)" }

# -----------------------------------------------------------------------------

[commands.undo]
canonical = "undo"
aliases = ["oops"]
typos = ["unod", "udno"]
syntax = "undo [<count>]"
arg_style = "none"
layer = "core"
description = "Undo last action(s)"

[commands.undo.examples]
"undo" = { output = "Undid: create box-1" }
"undo 3" = { output = "Undid 3 actions" }
"oops" = { corrected = false, output = "Undid: ..." }

# -----------------------------------------------------------------------------

[commands.redo]
canonical = "redo"
aliases = []
typos = ["reod", "rdeo"]
syntax = "redo [<count>]"
arg_style = "none"
layer = "core"
description = "Redo undone action(s)"

# -----------------------------------------------------------------------------

[commands.credits]
canonical = "credits"
aliases = []
typos = []
syntax = "credits"
arg_style = "none"
layer = "core"
description = "Show credits"

# -----------------------------------------------------------------------------
# 3D/2D LAYER - Object manipulation
# -----------------------------------------------------------------------------

[commands.list]
canonical = "list"
aliases = ["ls", "objects"]
typos = ["lst", "lis", "lsit"]
syntax = "list [all] [<type>]"
arg_style = "array"
layer = "3d"
description = "List objects in scene"

[commands.list.examples]
"list" = { output = "Objects: box-1, sphere-1, ball-2" }
"ls" = { corrected = false, output = "Objects: ..." }
"lst" = { corrected = "list", output = "Objects: ..." }
"list all" = { output = "All objects (no truncation): ..." }
"list box" = { output = "Boxes: box-1, box-2" }

# -----------------------------------------------------------------------------

[commands.look]
canonical = "look"
aliases = ["l", "examine", "inspect", "x", "ex", "properties", "props"]
typos = ["lok", "lool"]
syntax = "look [<object>]"
arg_style = "joined"
layer = "3d"
description = "Examine object properties (human-readable summary)"

[commands.look.behavior]
no_arg = "list_all"  # No argument = same as 'list'

[commands.look.examples]
"look box-1" = { output = "box-1: x=0, y=50, z=0, color=#00ff00, scale=1" }
"l box-1" = { corrected = false, output = "box-1: ..." }
"look" = { output = "Objects: ..." }

# -----------------------------------------------------------------------------

[commands.dump]
canonical = "dump"
aliases = ["json", "export"]
typos = ["dmp", "dupm"]
syntax = "dump <object>"
arg_style = "single"
layer = "3d"
description = "Dump object as full JSON (machine-readable)"

[commands.dump.examples]
"dump box-1" = { output = '{"name":"box-1","x":0,"y":50,"z":0,"color":"#00ff00","scale":1,"visible":true}' }
"json box-1" = { corrected = false, output = '{"name":"box-1",...}' }

# -----------------------------------------------------------------------------

[commands.create]
canonical = "create"
aliases = ["new", "add", "make"]
typos = ["creat", "crate", "craete", "creaet"]
syntax = "create [<type>] <name>"
arg_style = "cmd_array"
layer = "3d"
description = "Create a new object"

[commands.create.behavior]
# If object with name already exists, clone instead
existing_name = "clone_with_warning"
existing_message = "'{name}' exists. Cloning as '{new_name}'."
# Sequential naming: box → box-1, box-2, etc.
sequential_naming = true

[commands.create.examples]
"create box" = { output = "Created box-1", object = "box-1", type = "box" }
"create sphere ball" = { output = "Created ball (sphere)", object = "ball", type = "sphere" }
"creat box" = { corrected = "create box", output = "Created box-1" }
# If box-1 exists:
"create box-1" = { warning = "box-1 exists. Cloning as box-2.", output = "Created box-2" }

# -----------------------------------------------------------------------------

[commands.delete]
canonical = "delete"
aliases = ["remove", "destroy", "rm"]
typos = ["delte", "deleet", "delet"]
syntax = "delete <object> | delete all [<type>]"
arg_style = "array"
layer = "3d"
description = "Delete object(s)"

[commands.delete.behavior]
# Bulk delete requires confirmation above threshold
bulk_confirm_threshold = 10
bulk_confirm_message = "Delete {count} objects? (yes/no)"

[commands.delete.examples]
"delete box-1" = { output = "Deleted box-1" }
"delete all boxes" = { output = "Deleted 5 boxes" }
"delte box-1" = { corrected = "delete box-1", output = "Deleted box-1" }

# -----------------------------------------------------------------------------

[commands.clone]
canonical = "clone"
aliases = ["copy", "duplicate", "dup"]
typos = ["cloen", "clonee"]
syntax = "clone <source> [as <name>]"
arg_style = "joined"
layer = "3d"
description = "Clone an object"

[commands.clone.behavior]
# If source doesn't exist, create it instead
missing_source = "create_with_warning"
missing_message = "'{source}' doesn't exist. Creating instead."

[commands.clone.examples]
"clone box-1" = { output = "Created box-2 (cloned from box-1)" }
"copy box-1" = { corrected = false, output = "Created box-2 ..." }
# If widget doesn't exist:
"clone widget" = { warning = "'widget' doesn't exist. Creating instead.", output = "Created widget-1" }

# -----------------------------------------------------------------------------

[commands.set]
canonical = "set"
aliases = []
typos = ["st", "se", "ste"]
syntax = "set <object> [<property>] to <value>"
arg_style = "cmd_array"
layer = "3d"
description = "Set object property"

[commands.set.inference]
# Implied 'to' - "set x 50" → "set x to 50"
implied_to = true
implied_to_message = "[implied: to]"

# Property inference from value type
infer_color_from_names = true
color_names = ["red", "green", "blue", "yellow", "cyan", "magenta", "white", "black", "orange", "purple", "pink", "gray", "grey", "gold", "silver"]

[commands.set.examples]
"set box-1 x to 100" = { output = "box-1.x = 100" }
"set box-1 x 100" = { corrected = "set box-1 x to 100", output = "box-1.x = 100" }
"set box-1 color to red" = { output = "box-1.color = #ff0000" }
"set box-1 red" = { corrected = "set box-1 color to red", output = "box-1.color = #ff0000" }

# British spelling support
[commands.set.spellings]
colour = "color"
centre = "center"
grey = "gray"

# -----------------------------------------------------------------------------

[commands.get]
canonical = "get"
aliases = []
typos = ["gte", "ge"]
syntax = "get <object> <property>"
arg_style = "array"
layer = "3d"
description = "Get object property value"

[commands.get.examples]
"get box-1 x" = { output = "box-1.x = 100" }
"get box-1 color" = { output = "box-1.color = #ff0000" }

# -----------------------------------------------------------------------------

[commands.hide]
canonical = "hide"
aliases = []
typos = ["hdie", "hid"]
syntax = "hide <object>"
arg_style = "single"
layer = "3d"
description = "Hide object"

[commands.hide.examples]
"hide box-1" = { output = "box-1 hidden" }

# -----------------------------------------------------------------------------

[commands.show]
canonical = "show"
aliases = ["unhide"]
typos = ["shwo", "sho"]
syntax = "show <object>"
arg_style = "single"
layer = "3d"
description = "Show hidden object"

[commands.show.examples]
"show box-1" = { output = "box-1 visible" }

# -----------------------------------------------------------------------------

[commands.make]
canonical = "make"
aliases = []
typos = ["mak", "maek"]
syntax = "make <object> <modifier>"
arg_style = "cmd_array"
layer = "3d"
description = "Natural language modifications"

[commands.make.modifiers]
# Scale modifiers
bigger = { property = "scale", operation = "multiply", factor = 1.5 }
smaller = { property = "scale", operation = "divide", factor = 1.5 }
big = { property = "scale", operation = "multiply", factor = 1.5 }
large = { property = "scale", operation = "multiply", factor = 1.5 }
small = { property = "scale", operation = "divide", factor = 1.5 }
tiny = { property = "scale", operation = "divide", factor = 2.0 }

# Speed modifiers
faster = { property = "speed", operation = "multiply", factor = 1.5 }
slower = { property = "speed", operation = "divide", factor = 1.5 }
fast = { property = "speed", operation = "multiply", factor = 1.5 }
slow = { property = "speed", operation = "divide", factor = 1.5 }

# Visibility
visible = { command = "show" }
hidden = { command = "hide" }
invisible = { command = "hide" }

[commands.make.examples]
"make box-1 bigger" = { output = "box-1.scale = 1.5" }
"make box-1 red" = { corrected = "set box-1 color to red", output = "box-1.color = #ff0000" }

# -----------------------------------------------------------------------------

[commands.move]
canonical = "move"
aliases = []
typos = ["mov", "mvoe"]
syntax = "move <object> to <x> <y> [<z>]"
arg_style = "cmd_array"
layer = "3d"
description = "Move object to position"

[commands.move.examples]
"move box-1 to 100 200" = { output = "box-1 moved to (100, 200)" }
"move box-1 to 100 200 50" = { output = "box-1 moved to (100, 200, 50)" }

# -----------------------------------------------------------------------------

[commands.count]
canonical = "count"
aliases = []
typos = ["coutn", "cont"]
syntax = "count [<type>]"
arg_style = "single"
layer = "3d"
description = "Count objects"

[commands.count.examples]
"count" = { output = "12 objects" }
"count box" = { output = "5 boxes" }

# =============================================================================
# REPL BEHAVIOR
# =============================================================================

[repl]
prompt = "rosh> "
multiline_prompt = "...> "
history_stores = "canonical"  # Always store corrected form

[repl.startup]
banner = """
Rosh v{version} - EXPERIMENTAL
Type 'help' for commands.
"""

[repl.quiet_mode]
command = "meta quiet"
disable = "meta verbose"
description = "Reduce correction noise in output"

# =============================================================================
# ERROR MESSAGES
# =============================================================================

[errors]
unknown_command = "Unknown command: '{cmd}'. Type 'help' for commands."
unknown_object = "Object '{name}' not found."
missing_argument = "Missing argument. Usage: {usage}"
invalid_value = "Invalid value: '{value}' for property '{property}'"

# =============================================================================
# WARNING MESSAGES
# =============================================================================

[warnings]
typo_corrected = "[corrected: {from}->{to}]"
implied_word = "[implied: {word}]"
ambiguity_resolved = "[assumed: {assumption}]"
british_spelling = "[corrected: {from}->{to}]"

# =============================================================================
# META COMMANDS
# =============================================================================

[commands.meta]
canonical = "meta"
aliases = []
syntax = "meta <setting> [<value>]"
arg_style = "array"
layer = "core"
description = "Runtime settings"

[commands.meta.settings]
quiet = { description = "Reduce output noise", type = "bool", default = false }
verbose = { description = "Full output", type = "bool", default = true }
confirm = { description = "Confirm bulk operations", type = "bool", default = true }

[commands.meta.examples]
"meta quiet" = { output = "Quiet mode enabled." }
"meta verbose" = { output = "Verbose mode enabled." }
