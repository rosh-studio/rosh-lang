# Rosh In-Game Console Specification v0.2.0
# ==========================================
#
# WHAT THIS IS:
#   Defines commands for the RUNTIME console embedded in generated games.
#   This is NOT the CLI REPL (rosh repl) - that's defined in rosh-cli.toml.
#
# DEPENDENCY CHAIN:
#   rosh-console.toml (this file)
#       ↓ consumed by
#   src/rosh/emitters/*.py (phaser.py, pygame.py, threejs.py)
#       ↓ which generate
#   Runtime console code in output (game.js, game.py)
#
# UPSTREAM DEPENDENCIES:
#   - rosh-2d.toml (property names for 2D targets)
#   - rosh-3d.toml (property names for 3D targets)
#
# AUDIT REQUIREMENT:
#   tools/audit_spec.py must verify ALL emitters implement ALL required commands.
#
# VERSION POLICY:
#   When adding commands here, ALL emitters must be updated together.
#   See: docs/SPEC-CHAIN.md

[meta]
version = "0.2.5"
description = "In-game runtime console commands"
applies_to = ["emitters/phaser.py", "emitters/pygame.py", "emitters/threejs.py"]

# =============================================================================
# CONSOLE ACTIVATION
# =============================================================================

[activation]
key = "backtick"
description = "Press ` (backtick) to toggle console visibility"
required = true

# =============================================================================
# OBJECT REFERENCES
# =============================================================================

[references]
description = """
'it' and 'this' refer to the current object (last created or selected).
These are resolved before command execution.
"""

[references.it]
description = "Refers to the last created or selected object"
examples = [
    "create big blue ball",
    "move it to center",
    "make it spin",
]
behavior = "Resolved to object name before parsing"
feedback = "[resolved: it/this → <objectName>]"

[references.this]
description = "Alias for 'it'"
examples = [
    "get player",
    "set this color to red",
]

[references.current_object]
set_by = [
    "create - sets to newly created object",
    "get - sets to found object",
    "clone - sets to cloned object",
]

# =============================================================================
# REQUIRED COMMANDS - All emitters MUST implement these
# =============================================================================

[commands.list]
syntax = "list"
aliases = ["ls", "objects"]
description = "List all objects in the scene"
required = true
example = "list"
output = "Objects: player, enemy, wall"

[commands.look]
syntax = "look <object>"
aliases = ["l", "examine", "x"]
description = "Inspect an object's properties (human-readable summary)"
required = true
example = "look player"
output = "player: x=400, y=300, visible=true"

[commands.set]
syntax = "set <object> <property> to <value>"
aliases = []
description = "Set an object's property"
required = true
examples = [
    "set player x to 100",
    "set player color to red",
    "set player visible to false",
    "set logo text to hello world",
]
shorthand = [
    { syntax = "set <object> <color>", expands_to = "set <object> color to <color>" },
    { syntax = "set <object> to <color>", expands_to = "set <object> color to <color>" },
]

# Properties that set MUST support (from rosh-2d.toml / rosh-3d.toml)
supported_properties = [
    "x",
    "y",
    "z",          # 3D only
    "color",
    "visible",
    "text",
    "width",
    "height",
]

# Named colors that set MUST recognize
named_colors = [
    "red",
    "green",
    "blue",
    "yellow",
    "cyan",
    "magenta",
    "white",
    "black",
    "orange",
    "purple",
]

[commands.hide]
syntax = "hide <object> | hide all [<type>]"
aliases = []
description = "Hide an object or all objects (optionally filtered by type/color)"
required = true
examples = [
    "hide enemy",
    "hide all",
    "hide all spheres",
    "hide all blue",
]

[commands.show]
syntax = "show <object> | show all [<type>]"
aliases = ["unhide"]
description = "Show an object or all objects (optionally filtered by type/color)"
required = true
examples = [
    "show enemy",
    "show all",
    "show all cubes",
    "show all red",
]

[commands.create]
syntax = "create [modifiers...] <name> [at <x> <y>]"
aliases = []
description = "Create a new object at runtime"
required = true
examples = [
    "create box",
    "create ball at 100 200",
    "create blue box",
    "create big red ball",
]
modifiers = [
    { type = "color", words = ["red", "green", "blue", "yellow", "cyan", "magenta", "white", "black", "orange", "purple", "pink", "gray", "grey", "gold", "silver"] },
    { type = "size", words = ["big", "large", "small", "tiny", "huge"] },
    { type = "shape", words = ["ball", "sphere", "cube", "box", "cylinder", "tube", "cone", "torus", "ring", "plane"] },
]

# Shape synonyms - these map to canonical geometry types
[commands.create.shape_synonyms]
ball = "sphere"
box = "cube"
tube = "cylinder"
ring = "torus"
parsing = """
Parse modifiers from the description, name is the LAST non-modifier word:
  'create blue box' → name='box', color=blue
  'create big red ball' → name='ball', color=red, size=big
  'create thing' → name='thing', defaults applied
"""
behavior = [
    "If name exists, auto-number: box, box2, box3...",
    "Default position is screen/world center",
    "Default color is green",
    "Default size is 50x50 (2D) or 1x1x1 (3D)",
]

[commands.help]
syntax = "help"
aliases = ["?"]
description = "Show available commands"
required = true

[commands.get]
syntax = "get <object> | get <color> <shape>"
aliases = []
description = "Select an object for manipulation. Supports deep search by attributes."
required = true
examples = [
    "get player",
    "get blue box",
    "get red sphere",
    "get cube",
]

[commands.get.deep_search]
description = """
When exact name match fails, search by attributes:
1. Parse query for known colors and shape types
2. Search all objects matching color AND/OR shape
3. Report matches with [deep search] indicator
4. Auto-select first match if multiple found
"""
examples = [
    { input = "get blue box", output = "[deep search] Found 4: cube1, cube2, cube3, cube4" },
    { input = "get red sphere", output = "[deep search] <object: orbiter1>" },
]

# =============================================================================
# OPTIONAL COMMANDS - Emitters MAY implement these
# =============================================================================

[commands.dump]
syntax = "dump <object>"
aliases = ["json"]
description = "Dump object as full JSON (machine-readable)"
required = false
example = "dump player"
output = '{"name":"player","x":400,"y":300,"visible":true,"color":"#00ff00"}'

[commands.delete]
syntax = "delete <object>"
aliases = ["destroy", "remove", "rm"]
description = "Remove an object from the scene"
required = false

[commands.move]
syntax = "move <object> to <x> <y> [<z>] | move <object> to <named_position>"
aliases = []
description = "Move an object to coordinates or a named position"
required = false
examples = [
    "move ball to 0 5 0",
    "move ball to center",
    "move ball to the center",
    "move ball to origin",
    "move ball to ground",
]

[commands.move.named_positions]
center = "Move to world center (0, currentY, 0) - keeps current height"
origin = "Move to world origin (0, 0, 0)"
ground = "Move to ground level (currentX, 0, currentZ) - keeps X/Z position"

[commands.clear]
syntax = "clear"
aliases = ["cls"]
description = "Clear console output"
required = false

[commands.reset]
syntax = "reset"
aliases = ["restart"]
description = "Reset game to initial state"
required = false

# =============================================================================
# CAPABILITY COMMANDS - Engine-driven animations
# =============================================================================
# These commands enable continuous animations driven by the game engine.
# They work in both 2D and 3D contexts with appropriate adaptations.

[commands.make]
syntax = "make <object> <modifier>"
aliases = []
description = "Apply natural language modifications including capabilities"
required = false
examples = [
    "make box spin",
    "make ball bounce",
    "make cube bigger",
    "make sphere red",
]

[commands.make.capabilities]
description = "Capabilities are engine-driven continuous animations"
spin = { syntax = "spin [<x> <y> <z>]", description = "Rotate continuously", default = "0 20 0" }
bounce = { syntax = "bounce [<amplitude> <frequency>]", description = "Bounce up and down", default = "0.5 1" }
pulse = { syntax = "pulse [<amount> <frequency>]", description = "Scale in and out", default = "0.2 0.5" }
orbit = { syntax = "orbit [<radius> <speed> <height>]", description = "Orbit around center (3D only)", default = "3 30 2" }

[commands.make.stop]
syntax = "stop <capability>"
description = "Stop a capability animation"
examples = [
    "make box stop spin",
    "make ball stop bounce",
    "stop spin",           # Applies to current object
]

# =============================================================================
# ERROR HANDLING
# =============================================================================

[errors]
unknown_command = "Unknown command: {command}"
object_not_found = "Object not found: {name}"
invalid_syntax = "Usage: {correct_syntax}"
invalid_value = "Invalid value: {value}"

# =============================================================================
# VISUAL STYLE
# =============================================================================

[style]
background_color = "#141428"      # Dark blue, semi-transparent
background_alpha = 220            # 0-255
header_color = "#64c8ff"          # Light blue
text_color = "#c8c8c8"            # Light gray
error_color = "#ff6464"           # Red
prompt_color = "#00ffff"          # Cyan
prompt_symbol = "> "
cursor = "_"
font_size = 20
max_output_lines = 7
