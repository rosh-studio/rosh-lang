# Rosh 3D Properties Specification v0.2.0
#
# Defines properties for 3D objects (meshes, lights, cameras)
# Used by: Three.js emitter (future: Unity, Godot)
#
# Run: python -m rosh.spec.loader 3d
# Test: pytest tests/spec/test_3d_compliance.py

[meta]
version = "0.2.4"
description = "Rosh 3D properties specification"
status = "draft"
experimental = true

[meta.mode_fallback]
description = "Rosh programs can specify mode='arcade' to use 2D rendering instead"
arcade_mode = "When mode='arcade' is set in program metadata, fall back to 2D spec"
default = "3D mode is the default for programs without explicit mode setting"

# =============================================================================
# OBJECT TYPES
# =============================================================================

[types.mesh]
description = "3D geometric mesh"
subtypes = ["box", "sphere", "cylinder", "plane", "cone", "torus"]
default = "box"

# Shape synonyms for natural language support
[types.mesh.synonyms]
ball = "sphere"
cube = "box"
tube = "cylinder"
ring = "torus"

[types.light]
description = "Light source"
subtypes = ["ambient", "directional", "point", "spot"]

[types.camera]
description = "View camera"
subtypes = ["perspective", "orthographic"]

[types.text3d]
description = "3D text (extruded or flat)"
requires = ["text"]

[types.group]
description = "Container for multiple 3D objects"

# =============================================================================
# POSITION PROPERTIES (3D extends 2D with z-axis)
# =============================================================================

[properties.x]
type = "number"
description = "Position on X-axis (left/right)"
default = 0
default_note = "New 3D objects appear at world origin (0, 0, 0)"
unit = "world_units"
aliases = ["left"]

[properties.y]
type = "number"
description = "Position on Y-axis (up/down)"
default = 0.5
default_note = "Objects appear above ground (y=0.5 for 1x1 box sits on floor)"
unit = "world_units"
aliases = ["up"]

[properties.z]
type = "number"
description = "Position on Z-axis (forward/back)"
default = 0
default_note = "z=0 is at origin, visible from default camera position"
unit = "world_units"
aliases = ["depth", "forward"]

[properties.position.examples]
"set x to 10" = { value = 10 }
"set y to 5" = { value = 5 }
"set z to -20" = { value = -20 }
"move box to 10 5 -20" = { effect = "sets x, y, z in one command" }

# =============================================================================
# SIZE PROPERTIES
# =============================================================================

[properties.width]
type = "number"
description = "Width on X-axis"
default = 1
unit = "world_units"
aliases = ["w"]

[properties.height]
type = "number"
description = "Height on Y-axis"
default = 1
unit = "world_units"
aliases = ["h"]

[properties.depth_size]
type = "number"
description = "Depth on Z-axis"
default = 1
unit = "world_units"
aliases = ["d", "length"]

[properties.radius]
type = "number"
description = "Radius for spheres, cylinders, cones"
default = 0.5
unit = "world_units"
aliases = ["r"]

[properties.scale]
type = "number"
description = "Uniform scale multiplier"
default = 1.0
aliases = ["size"]

[properties.scale_x]
type = "number"
description = "Scale on X-axis"
default = 1.0

[properties.scale_y]
type = "number"
description = "Scale on Y-axis"
default = 1.0

[properties.scale_z]
type = "number"
description = "Scale on Z-axis"
default = 1.0

# =============================================================================
# ROTATION PROPERTIES
# =============================================================================

[properties.rotation_x]
type = "number"
description = "Rotation around X-axis (pitch)"
default = 0
unit = "degrees"
aliases = ["pitch", "rx"]

[properties.rotation_y]
type = "number"
description = "Rotation around Y-axis (yaw)"
default = 0
unit = "degrees"
aliases = ["yaw", "ry"]

[properties.rotation_z]
type = "number"
description = "Rotation around Z-axis (roll)"
default = 0
unit = "degrees"
aliases = ["roll", "rz"]

[properties.rotation.examples]
"set rotation_x to 45" = { value = 45, unit = "degrees" }
"set pitch to 90" = { value = 90, unit = "degrees" }

# =============================================================================
# MATERIAL/APPEARANCE PROPERTIES
# =============================================================================

[properties.color]
type = "color"
description = "Object color"
default = "#00ff00"
format = "hex_rgb"
aliases = ["colour"]

[properties.color.named_colors]
red = "#ff0000"
green = "#00ff00"
blue = "#0000ff"
yellow = "#ffff00"
cyan = "#00ffff"
magenta = "#ff00ff"
white = "#ffffff"
black = "#000000"
orange = "#ff8800"
purple = "#8800ff"
pink = "#ff88cc"
gray = "#888888"
grey = "#888888"
gold = "#ffd700"
silver = "#c0c0c0"

# -----------------------------------------------------------------------------

[properties.material]
type = "string"
description = "Material type"
default = "standard"
values = ["basic", "standard", "phong", "lambert", "physical"]
aliases = ["mat"]

[properties.material.notes]
basic = "Unlit, flat color (no shadows)"
standard = "PBR material with metalness/roughness"
phong = "Classic specular highlights"
lambert = "Diffuse only (no specular)"
physical = "Advanced PBR with more parameters"

# -----------------------------------------------------------------------------

[properties.metalness]
type = "number"
description = "How metallic the surface is"
default = 0.0
min = 0.0
max = 1.0
requires_material = ["standard", "physical"]

[properties.roughness]
type = "number"
description = "Surface roughness (0 = mirror, 1 = matte)"
default = 0.5
min = 0.0
max = 1.0
requires_material = ["standard", "physical"]

# -----------------------------------------------------------------------------

[properties.opacity]
type = "number"
description = "Transparency (0.0 = invisible, 1.0 = solid)"
default = 1.0
min = 0.0
max = 1.0
aliases = ["alpha", "transparency"]

[properties.visible]
type = "boolean"
description = "Whether object is rendered"
default = true
aliases = ["shown"]

# -----------------------------------------------------------------------------

[properties.wireframe]
type = "boolean"
description = "Render as wireframe"
default = false

[properties.side]
type = "string"
description = "Which side(s) to render"
default = "front"
values = ["front", "back", "both"]

# =============================================================================
# TEXT PROPERTIES (for text3d type)
# =============================================================================

[properties.text]
type = "string"
description = "Text content for 3D text objects"
applies_to = ["text3d"]
aliases = ["content", "label"]

[properties.font_family]
type = "string"
description = "Font family name"
default = "Inter"
default_note = "Inter is the default font across all Rosh targets for consistent look"
fallback = ["system-ui", "Arial", "sans-serif"]
applies_to = ["text3d"]
aliases = ["font"]

[properties.font_size]
type = "number"
description = "Font size in world units"
default = 1.0
unit = "world_units"
applies_to = ["text3d"]
aliases = ["size", "fontSize"]

[properties.text_align]
type = "string"
description = "Text alignment"
default = "center"
values = ["left", "center", "right"]
applies_to = ["text3d"]
aliases = ["align"]

# =============================================================================
# TEXTURE PROPERTIES
# =============================================================================

[properties.texture]
type = "string"
description = "Texture image filename"
aliases = ["map", "image"]

[properties.normal_map]
type = "string"
description = "Normal map for surface detail"
aliases = ["bump"]

[properties.environment_map]
type = "string"
description = "Environment map for reflections"
aliases = ["env_map", "reflection"]

# =============================================================================
# LIGHT PROPERTIES
# =============================================================================

[properties.intensity]
type = "number"
description = "Light brightness"
default = 1.0
min = 0.0
applies_to = ["light"]

[properties.distance]
type = "number"
description = "Light falloff distance (0 = infinite)"
default = 0
applies_to = ["point", "spot"]

[properties.angle]
type = "number"
description = "Spotlight cone angle in degrees"
default = 60
unit = "degrees"
applies_to = ["spot"]

[properties.penumbra]
type = "number"
description = "Spotlight edge softness"
default = 0.0
min = 0.0
max = 1.0
applies_to = ["spot"]

[properties.cast_shadow]
type = "boolean"
description = "Whether light casts shadows"
default = true
applies_to = ["directional", "point", "spot"]

# =============================================================================
# CAMERA PROPERTIES
# =============================================================================

[properties.fov]
type = "number"
description = "Field of view in degrees"
default = 75
unit = "degrees"
applies_to = ["perspective"]

[properties.near]
type = "number"
description = "Near clipping plane"
default = 0.1
applies_to = ["camera"]

[properties.far]
type = "number"
description = "Far clipping plane"
default = 1000
applies_to = ["camera"]

[properties.look_at]
type = "vector3"
description = "Point the camera looks at"
default = [0, 0, 0]
applies_to = ["camera"]

# =============================================================================
# PHYSICS PROPERTIES (Optional)
# =============================================================================

[properties.mass]
type = "number"
description = "Object mass for physics"
default = 1.0
min = 0.0

[properties.velocity]
type = "vector3"
description = "Velocity vector [vx, vy, vz]"
default = [0, 0, 0]

[properties.angular_velocity]
type = "vector3"
description = "Angular velocity [rx, ry, rz]"
default = [0, 0, 0]

[properties.gravity]
type = "boolean"
description = "Whether gravity affects this object"
default = false

[properties.kinematic]
type = "boolean"
description = "Physics-controlled position (vs. script-controlled)"
default = false

# =============================================================================
# SCENE PROPERTIES
# =============================================================================

[properties.scene]
type = "string"
description = "Named scene this object belongs to"
optional = true
aliases = ["world", "room"]

[properties.level]
type = "number"
description = "Level number within scene"
optional = true

# =============================================================================
# COORDINATE SYSTEM
# =============================================================================

[coordinates]
handedness = "right"
up_axis = "y"
forward_axis = "-z"
unit = "world_units"

[coordinates.notes]
description = """
3D uses right-handed coordinates:
- X: positive = right
- Y: positive = up
- Z: positive = toward viewer (camera looks down -Z)
"""

# =============================================================================
# ENVIRONMENT
# =============================================================================

[environment.floor]
type = "boolean"
description = "Whether to show floor plane"
default = false
meta_command = "meta floor on"

[environment.grid]
type = "boolean"
description = "Whether to show grid helper"
default = true
meta_command = "meta grid on"

[environment.floor_color]
type = "color"
description = "Floor color when visible"
default = "#333333"

[environment.background]
type = "color"
description = "Scene background color"
default = "#1a1a2e"

[environment.fog]
type = "boolean"
description = "Whether fog is enabled"
default = false

[environment.fog_color]
type = "color"
description = "Fog color"
default = "#ffffff"

[environment.fog_density]
type = "number"
description = "Fog density"
default = 0.01

# =============================================================================
# BEHAVIOR RULES
# =============================================================================

[behavior.default_position]
description = "Where new 3D objects appear"
rule = "New objects appear at world origin (0, 0, 0) - center of scene"
offset_rule = "Multiple objects created together are offset along X-axis"
offset_amount = 2
offset_unit = "world_units"
note = "Camera looks at origin, so new objects are immediately visible"

[behavior.default_size]
description = "Default size for new objects"
rule = "Objects default to 1x1x1 world units (visible from default camera)"

[behavior.color_inheritance]
description = "Color is auto-assigned if not specified"
rule = "Objects get rotating colors from palette: green, blue, red, yellow, ..."

# =============================================================================
# CAPABILITIES - Engine-driven continuous animations
# =============================================================================
# Capabilities are animations driven by the game engine's update loop.
# They can be set in .rosh files or via console commands.
# Format in .rosh: set spin to "x y z" (degrees per second for each axis)

[capabilities.spin]
type = "vector3"
description = "Continuous rotation around axes (degrees per second)"
format = "x y z"
default = [0, 20, 0]
example = 'set spin to "0 30 0"'
userData_key = "_spin"
note = "Applies rotation.x/y/z += speed * deltaTime each frame"

[capabilities.bounce]
type = "vector2"
description = "Vertical bouncing animation"
format = "amplitude frequency"
default = [0.5, 1]
example = 'set bounce to "0.5 1"'
userData_key = "_bounce"
note = "Modifies position.y using sine wave"

[capabilities.pulse]
type = "vector2"
description = "Scale pulsing animation"
format = "amount frequency"
default = [0.2, 0.5]
example = 'set pulse to "0.2 0.5"'
userData_key = "_pulse"
note = "Modifies scale uniformly using sine wave"

[capabilities.orbit]
type = "vector3"
description = "Orbital motion around center point"
format = "radius speed height"
default = [3, 30, 2]
example = 'set orbit to "3 30 2"'
userData_key = "_orbit"
note = "Circles around world origin at given radius/speed/height"

[capabilities.initialization]
description = """
Capabilities set in .rosh files are stored in userData as arrays.
On scene load, the engine traverses all objects and registers
those with capability userData in the animation state maps.
"""

# =============================================================================
# DEEP SEARCH - Find objects by attributes
# =============================================================================

[deep_search]
description = """
When 'get <query>' doesn't match an exact object name, perform deep search:
1. Parse query for known colors and shape types
2. Check each mesh's material color and geometry type
3. Return matching objects with [deep search] indicator
"""

[deep_search.color_detection]
description = "Detect color from material or userData"
sources = ["userData._color", "material.color (hex analysis)"]
fuzzy_matching = """
If exact hex not found, use RGB thresholds:
- red: r>200, g<100, b<100
- blue: r<100, g<100, b>200
- etc.
"""

[deep_search.type_detection]
description = "Detect shape type from geometry or userData"
sources = ["userData._type", "geometry.type"]
mapping = """
BoxGeometry → cube
SphereGeometry → sphere
CylinderGeometry → cylinder
ConeGeometry → cone
TorusGeometry → torus
"""
