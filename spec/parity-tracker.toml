# Parity Tracker - JS/Python Function Alignment
#
# This file tracks which functions must stay in sync between:
#   - static/rosh-runtime.js (JS runtime)
#   - src/rosh/interpreter.py (Python interpreter)
#
# Naming convention: same names, just case differs
#   JS:  camelCase    (fuzzyFindObject)
#   Py:  snake_case   (fuzzy_find_object)
#
# Version tags: Each paired function has @parity <group> v<N>
#   - When you modify one, bump the version
#   - Run: ./scripts/check-parity.sh to find mismatches
#
# STATUS KEY:
#   synced   = Same logic, same version
#   drift    = Logic differs, needs review
#   js_only  = No Python equivalent (acceptable)
#   py_only  = No JS equivalent (acceptable)

[meta]
last_audit = "2025-01-10"
js_file = "static/rosh-runtime.js"
py_file = "src/rosh/interpreter.py"

