[meta]
version = "0.2.3"
created = "2025-12-27"
author = "rdubar"
ai_collaborator = "Claude Opus 4.5"

# =============================================================================
# SECTION 1: PARSER FUNDAMENTALS
# =============================================================================

[tests.parse_create_object_basic]
section = "parser"
input = """
create object player
  x: 100
  y: 200
end
"""
expect = "success"
value = { object = "player", x = 100, y = 200 }
notes = "Standard object creation with body"

[tests.parse_create_object_empty]
section = "parser"
input = """
create object empty_thing
end
"""
expect = "success"
value = { object = "empty_thing" }
notes = "Empty body is valid - object gets default properties"

[tests.parse_create_inline]
section = "parser"
input = "create player"
expect = "success"
value = { object = "player" }
notes = "Single-line create without body"

[tests.parse_create_value]
section = "parser"
input = "create score to 0"
expect = "success"
value = { variable = "score", value = 0 }
notes = "'to' indicates value creation, not object"

[tests.parse_create_missing_name]
section = "parser"
input = "create"
expect = "error"
message = "Usage: create <name>"
notes = "Must provide a name"

[tests.parse_set_basic]
section = "parser"
input = "set x to 50"
expect = "success"
value = { x = 50 }
notes = "Basic variable assignment"

[tests.parse_set_property_space]
section = "parser"
input = "set player x to 100"
expect = "success"
value = { target = "player.x", value = 100 }
notes = "Space syntax for property access"

[tests.parse_set_property_dot]
section = "parser"
input = "set player.x to 100"
expect = "success"
value = { target = "player.x", value = 100 }
notes = "Dot syntax equivalent to space"

[tests.parse_set_implied_to]
section = "parser"
input = "set x 50"
expect = "success"
value = { x = 50 }
message = "[implied: to]"
notes = "'to' is optional - speech-friendly"

[tests.parse_set_missing_value]
section = "parser"
input = "set x to"
expect = "error"
message = "Missing value"
notes = "Value is required"

[tests.parse_set_empty]
section = "parser"
input = "set"
expect = "error"
message = "Usage: set <target> to <value>"
notes = "Helpful syntax message"

# =============================================================================
# SECTION 2: VOICE NORMALIZATION
# =============================================================================

[tests.voice_to_preserved_in_set]
section = "voice"
input = "set thing x to 50"
expect = "success"
value = { target = "thing.x", value = 50 }
message = ""
notes = "'to' is keyword, NOT '2'. BUG-008 root cause."

[tests.voice_to_preserved_in_move]
section = "voice"
input = "move thing to 100 200"
expect = "success"
value = { target = "thing", x = 100, y = 200 }
notes = "'to' is keyword in move command"

[tests.voice_rosh_spelling]
section = "voice"
input = "raush help"
expect = "success"
message = "[corrected: raush -> rosh]"
notes = "Common mishearing"

[tests.voice_colour_spelling]
section = "voice"
input = "set box colour to red"
expect = "success"
value = { target = "box.color", value = "red" }
message = "[corrected: colour -> color]"
notes = "British spelling normalized"

[tests.voice_grey_spelling]
section = "voice"
input = "set box color to grey"
expect = "success"
value = { target = "box.color", value = "gray" }
message = "[corrected: grey -> gray]"
notes = "British spelling normalized"

[tests.voice_creat_typo]
section = "voice"
input = "creat box"
expect = "success"
value = { object = "box" }
message = "[corrected: creat -> create]"
notes = "Common typo"

[tests.voice_quoted_no_correction]
section = "voice"
input = 'set box text to "Jim is Great"'
expect = "success"
value = { target = "box.text", value = "Jim is Great" }
message = ""
notes = "Text inside quotes NEVER corrected. BUG-006."

[tests.voice_quoted_case_preserved]
section = "voice"
input = 'set box text to "Jim Burns"'
expect = "success"
value = { target = "box.text", value = "Jim Burns" }
notes = "Case inside quotes preserved. BUG-007."

[tests.voice_quoted_grey_preserved]
section = "voice"
input = 'set box text to "The grey sky"'
expect = "success"
value = { target = "box.text", value = "The grey sky" }
notes = "'grey' inside quotes stays as 'grey'"

[tests.voice_color_infer_property]
section = "voice"
input = "set box red"
expect = "success"
value = { target = "box.color", value = "red" }
message = "[inferred: color property]"
notes = "Color name implies color property"

# =============================================================================
# SECTION 3: OBJECT CREATION
# =============================================================================

[tests.create_simple]
section = "create"
input = "create box"
expect = "success"
value = { object = "box", color = "green", size = 1.0 }
notes = "Default color=green, size=1.0"

[tests.create_with_color]
section = "create"
input = "create blue box"
expect = "success"
value = { object = "box", color = "blue" }
notes = "Color modifier"

[tests.create_with_size_big]
section = "create"
input = "create big box"
expect = "success"
value = { object = "box", size = 2.0 }
notes = "'big' = size 2.0"

[tests.create_with_size_small]
section = "create"
input = "create small box"
expect = "success"
value = { object = "box", size = 0.5 }
notes = "'small' = size 0.5"

[tests.create_multiple_mods]
section = "create"
input = "create big blue box"
expect = "success"
value = { object = "box", color = "blue", size = 2.0 }
notes = "Multiple modifiers"

[tests.create_mod_order_irrelevant]
section = "create"
input = "create blue big box"
expect = "success"
value = { object = "box", color = "blue", size = 2.0 }
notes = "Order doesn't matter"

[tests.create_with_article_a]
section = "create"
input = "create a box"
expect = "success"
value = { object = "box" }
notes = "Article 'a' skipped"

[tests.create_with_article_the]
section = "create"
input = "create the big blue box"
expect = "success"
value = { object = "box", color = "blue", size = 2.0 }
notes = "Article 'the' skipped"

[tests.create_with_position]
section = "create"
input = "create box at 100 200"
expect = "success"
value = { object = "box", x = 100, y = 200 }
notes = "Position with 'at' keyword"

[tests.create_sphere_shape]
section = "create"
input = "create sphere"
expect = "success"
value = { object = "sphere", shape = "sphere" }
notes = "'sphere' is both name and shape"

[tests.create_ball_shape]
section = "create"
input = "create ball"
expect = "success"
value = { object = "ball", shape = "sphere" }
notes = "'ball' maps to sphere"

[tests.create_duplicate_autonumber]
section = "create"
input = "create box"
setup = "create box"
expect = "success"
value = { object = "box-2" }
notes = "Duplicate gets hyphenated suffix"

[tests.create_bulk]
section = "create"
input = "create 10 balls"
expect = "success"
value = { count = 10, base_name = "ball" }
notes = "Bulk creation"

[tests.create_bulk_zero]
section = "create"
input = "create 0 balls"
expect = "warning"
message = "Count must be positive"
value = { count = 0 }
notes = "Zero is no-op"

[tests.create_bulk_max]
section = "create"
input = "create 10000 balls"
expect = "warning"
message = "Creating 1000 (maximum)"
value = { count = 1000 }
notes = "Capped at 1000"

[tests.create_only_article]
section = "create"
input = "create a"
expect = "error"
message = "Usage: create <name>"
notes = "Article alone is not a name"

# =============================================================================
# SECTION 4: PROPERTY SETTING
# =============================================================================

[tests.set_x_integer]
section = "set"
input = "set box x to 100"
expect = "success"
value = { target = "box.x", value = 100 }

[tests.set_x_float]
section = "set"
input = "set box x to 100.5"
expect = "success"
value = { target = "box.x", value = 100.5 }

[tests.set_x_negative]
section = "set"
input = "set box x to -50"
expect = "success"
value = { target = "box.x", value = -50 }
notes = "Negative position allowed"

[tests.set_x_percent]
section = "set"
input = "set box x to 50%"
expect = "success"
value = { target = "box.x", value = "50%" }
notes = "Percentage of viewport"

[tests.set_width_negative]
section = "set"
input = "set box width to -50"
expect = "warning"
message = "Width cannot be negative, using 0"
value = { target = "box.width", value = 0 }
notes = "Negative size clamped"

[tests.set_color_name]
section = "set"
input = "set box color to red"
expect = "success"
value = { target = "box.color", value = "#ff0000" }

[tests.set_color_hex]
section = "set"
input = "set box color to #ff0000"
expect = "success"
value = { target = "box.color", value = "#ff0000" }
notes = "Hex format"

[tests.set_color_hex_short]
section = "set"
input = "set box color to #f00"
expect = "success"
value = { target = "box.color", value = "#ff0000" }
notes = "Short hex expanded"

[tests.set_color_rgb]
section = "set"
input = "set box color to rgb(255, 0, 0)"
expect = "success"
value = { target = "box.color", value = "#ff0000" }
notes = "RGB format"

[tests.set_color_invalid]
section = "set"
input = "set box color to notacolor"
expect = "warning"
message = "Unknown color 'notacolor', using green"
value = { target = "box.color", value = "green" }
notes = "Invalid fallback"

[tests.set_visible_true]
section = "set"
input = "set box visible to true"
expect = "success"
value = { target = "box.visible", value = true }

[tests.set_visible_1]
section = "set"
input = "set box visible to 1"
expect = "success"
message = "[normalized: 1 -> true]"
value = { target = "box.visible", value = true }

[tests.set_visible_yes]
section = "set"
input = "set box visible to yes"
expect = "success"
message = "[normalized: yes -> true]"
value = { target = "box.visible", value = true }

[tests.set_text_simple]
section = "set"
input = "set label text to hello"
expect = "success"
value = { target = "label.text", value = "hello" }

[tests.set_text_multiword]
section = "set"
input = "set label text to hello world"
expect = "success"
value = { target = "label.text", value = "hello world" }
notes = "Everything after 'to' is value"

[tests.set_text_quoted]
section = "set"
input = 'set label text to "Hello World"'
expect = "success"
value = { target = "label.text", value = "Hello World" }
notes = "Quotes preserve case"

[tests.set_opacity_half]
section = "set"
input = "set box opacity to 0.5"
expect = "success"
value = { target = "box.opacity", value = 0.5 }

[tests.set_opacity_over]
section = "set"
input = "set box opacity to 1.5"
expect = "warning"
message = "Opacity clamped to 0-1"
value = { target = "box.opacity", value = 1.0 }

# =============================================================================
# SECTION 5: INSPECTION COMMANDS
# =============================================================================

[tests.look_object]
section = "inspect"
input = "look box"
expect = "success"
notes = "Shows properties"

[tests.look_aliases]
section = "inspect"
input = "l box"
expect = "success"
aliases = ["examine box", "inspect box", "x box"]
notes = "All aliases work"

[tests.look_nonexistent]
section = "inspect"
input = "look nonexistent"
expect = "error"
message = "Object not found: nonexistent"

[tests.look_no_arg]
section = "inspect"
input = "look"
expect = "success"
notes = "Lists all objects"

[tests.list_empty]
section = "inspect"
input = "list"
expect = "success"
message = "No objects"
notes = "Helpful message when empty"

[tests.dump_object]
section = "inspect"
input = "dump box"
expect = "success"
notes = "JSON output"

# =============================================================================
# SECTION 6: VISIBILITY
# =============================================================================

[tests.hide_object]
section = "visibility"
input = "hide box"
expect = "success"
value = { target = "box.visible", value = false }

[tests.hide_already_hidden]
section = "visibility"
input = "hide box"
setup = "hide box"
expect = "success"
notes = "Idempotent"

[tests.hide_nonexistent]
section = "visibility"
input = "hide nonexistent"
expect = "error"
message = "Object not found: nonexistent"

[tests.show_object]
section = "visibility"
input = "show box"
expect = "success"
value = { target = "box.visible", value = true }

[tests.show_alias_unhide]
section = "visibility"
input = "unhide box"
expect = "success"
value = { target = "box.visible", value = true }
notes = "'unhide' alias"

# =============================================================================
# SECTION 7: MOVEMENT
# =============================================================================

[tests.move_basic]
section = "move"
input = "move box to 100 200"
expect = "success"
value = { target = "box", x = 100, y = 200 }

[tests.move_3d]
section = "move"
input = "move box to 100 200 300"
expect = "success"
value = { target = "box", x = 100, y = 200, z = 300 }
notes = "3D position"

[tests.move_missing_to]
section = "move"
input = "move box 100 200"
expect = "error"
message = "Usage: move <object> to <x> <y>"
notes = "'to' required"

[tests.move_nonexistent]
section = "move"
input = "move nonexistent to 100 200"
expect = "error"
message = "Object not found: nonexistent"

# =============================================================================
# SECTION 8: DELETION
# =============================================================================

[tests.delete_object]
section = "delete"
input = "delete box"
expect = "success"
notes = "Object removed"

[tests.delete_aliases]
section = "delete"
input = "rm box"
expect = "success"
aliases = ["destroy box", "remove box"]
notes = "All aliases work"

[tests.delete_nonexistent]
section = "delete"
input = "delete nonexistent"
expect = "error"
message = "Object not found: nonexistent"

[tests.delete_no_arg]
section = "delete"
input = "delete"
expect = "error"
message = "Usage: delete <object>"

# =============================================================================
# SECTION 9: UNDO/REDO
# =============================================================================

[tests.undo_create]
section = "undo"
input = "undo"
setup = "create box"
expect = "success"
notes = "Reverses create"

[tests.undo_set]
section = "undo"
input = "undo"
setup = ["set box x to 100", "set box x to 200"]
expect = "success"
value = { target = "box.x", value = 100 }
notes = "Reverses property change"

[tests.undo_nothing]
section = "undo"
input = "undo"
expect = "warning"
message = "Nothing to undo"

[tests.undo_count]
section = "undo"
input = "undo 2"
setup = ["create box", "create ball", "create cube"]
expect = "success"
notes = "Undo multiple"

[tests.redo_basic]
section = "undo"
input = "redo"
setup = ["create box", "undo"]
expect = "success"
notes = "Restores undone"

[tests.redo_nothing]
section = "undo"
input = "redo"
expect = "warning"
message = "Nothing to redo"

[tests.oops_alias]
section = "undo"
input = "oops"
setup = "set box x to 999"
expect = "success"
notes = "'oops' = undo 1"

# =============================================================================
# SECTION 10: ERROR HANDLING
# =============================================================================

[tests.error_object_not_found]
section = "errors"
input = "set nonexistent x to 5"
expect = "error"
message = "Object not found: nonexistent"

[tests.error_unknown_command]
section = "errors"
input = "frobnicate box"
expect = "error"
message = "Unknown command: frobnicate"

[tests.error_fuzzy_suggestion]
section = "errors"
input = "creat box"
expect = "success"
message = "[corrected: creat -> create]"
notes = "Fuzzy match corrects"

[tests.error_helpful_syntax]
section = "errors"
input = "set"
expect = "error"
message = "Usage: set <target> to <value>"
notes = "Show syntax, not cryptic error"

# =============================================================================
# SECTION 11: EMITTER PARITY
# =============================================================================

[tests.parity_create_box]
section = "parity"
emitters = ["phaser", "pygame", "threejs", "godot"]
input = "create box"
expect = "success"
notes = "All emitters create object"

[tests.parity_set_color]
section = "parity"
emitters = ["phaser", "pygame", "threejs", "godot"]
input = "set box color to red"
expect = "success"
notes = "Color renders correctly"

[tests.parity_hide_show]
section = "parity"
emitters = ["phaser", "pygame", "threejs", "godot"]
input = ["hide box", "show box"]
expect = "success"
notes = "Visibility toggle"

[tests.parity_voice_correction]
section = "parity"
emitters = ["phaser", "pygame", "threejs", "godot"]
input = "set box colour to grey"
expect = "success"
message = "[corrected: colour -> color, grey -> gray]"
notes = "Corrections consistent"

[tests.parity_quoted_text]
section = "parity"
emitters = ["phaser", "pygame", "threejs", "godot"]
input = 'set label text to "Hello World"'
expect = "success"
value = { text = "Hello World" }
notes = "Quotes preserve case everywhere"

# =============================================================================
# SECTION 12: ERROR HANDLING (FUTURE - Go-Style)
# =============================================================================
# Status: NOT IMPLEMENTED - placeholder for future feature
# Reference: BACKLOG.md "Go-Style Error Handling"
# Design: Every operation returns with .error property

[tests.try_load_success]
section = "try"
status = "future"
input = """
result to load "test.json"
get result.error
"""
expect = "success"
value = { error = "" }
notes = "Successful load has empty error string"

[tests.try_load_failure]
section = "try"
status = "future"
input = """
result to load "nonexistent.json"
get result.error
"""
expect = "success"
value = { error = "File not found: nonexistent.json" }
notes = "Failed load has error message, NOT exception"

[tests.try_if_error]
section = "try"
status = "future"
input = """
try load "bad.json"
if error then
    print "handled"
end
"""
expect = "success"
notes = "Simple form sets 'error' variable"

[tests.try_set_invalid]
section = "try"
status = "future"
input = """
try set nonexistent x to 5
get error
"""
expect = "success"
value = { error = "Object not found: nonexistent" }
notes = "Even set can fail gracefully with try"

[tests.no_try_still_works]
section = "try"
status = "future"
input = "set nonexistent x to 5"
expect = "error"
message = "Object not found: nonexistent"
notes = "Without try, errors still happen normally"

# =============================================================================
