green = "#00ff00"
blue = "#0000ff"
yellow = "#ffff00"
cyan = "#00ffff"
magenta = "#ff00ff"
white = "#ffffff"
black = "#000000"
orange = "#ff8800"
purple = "#8800ff"
pink = "#ff88ff"
gray = "#888888"
grey = "#888888"
gold = "#ffd700"
silver = "#c0c0c0"

# =============================================================================
# SIZE MODIFIERS
# =============================================================================

[sizes]
tiny = 0.25
small = 0.5
medium = 1.0
big = 2.0
large = 2.0
huge = 4.0

# =============================================================================
# BOOLEAN NORMALIZATIONS
# =============================================================================

[booleans.true]
values = ["true", "1", "yes", "on", "TRUE", "Yes", "ON"]

[booleans.false]
values = ["false", "0", "no", "off", "FALSE", "No", "OFF"]
